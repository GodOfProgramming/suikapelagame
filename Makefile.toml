[config]
skip_core_tasks = true
skip_crate_env_info = true
skip_git_env_info = true
skip_rust_env_info = true

[tasks.play]
command = "cargo"
args = ["run"]

[tasks.dev]
command = "cargo"
args = ["run", "--features", "dev"]

[tasks.build-release]
description = "Build a release"
run_task = [
  { name = "build-windows", condition = { env = { "CARGO_MAKE_TASK_ARGS" = "windows" } } },
  { name = "build-host" },
]

[tasks.build-host]
command = "cargo"
args = ["build", "--release"]

[tasks.build-windows]
command = "cargo"
args = ["build", "--target", "x86_64-pc-windows-gnu", "--release"]
