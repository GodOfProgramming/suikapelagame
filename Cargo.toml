[package]
name = "suikapelagame"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
archipelago_rs = "3.0.1"
beditor = { path = "../beditor" }
bevy = { version = "0.19.0", features = ["system_clipboard"] }
bevy_defer = "0.18.0"
bevy_svg = { git = "https://github.com/dardT/bevy_svg.git", rev = "9eb6db38ba9f31173ef4eeb4f0eb7c873851e48b" } # "0.19.0"
mimalloc = "*"
parking_lot = "0.12.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.150"
serde_repr = "0.1.20"
validator = { version = "0.20.0", features = ["derive"] }

[build-dependencies]
anyhow = "1.0"

[profile.dev]
opt-level = 0

[profile.dev.package."*"]
opt-level = 3
