[package]
name = "suikapelagame"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
archipelago_rs = "3.0.1"
avian2d = { version = "0.7.0", features = ["serialize"] }
beditor = { path = "../beditor", optional = true }
bevy = { version = "0.19.0", features = ["system_clipboard", "mp3"] }
bevy_defer = "0.18.0"
bevy_prng = { version = "0.15", features = ["chacha20", "wyrand"] }
bevy_rand = "0.15"
bevy_simple_rich_text = "0.6.0"
bevy_svg = { git = "https://github.com/dardT/bevy_svg.git", rev = "9eb6db38ba9f31173ef4eeb4f0eb7c873851e48b" } # "0.19.0"
enum-iterator = "2.3.0"
enum-map = "2.7.3"
mimalloc = "*"
nameof = "1.3.0"
parking_lot = "0.12.5"
postcard = { version = "1.1.3", features = ["use-std"] }
rand = "0.10.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.150"
serde_repr = "0.1.20"
smol = "2.0.2"
strum = "0.28.0"
strum_macros = "0.28.0"
validator = { version = "0.20.0", features = ["derive"] }
wyrand = "0.4.1"

[build-dependencies]
anyhow = "1.0"

[profile.dev]
opt-level = 0

[profile.dev.package."*"]
opt-level = 3

[features]
dev = ["dep:beditor"]
